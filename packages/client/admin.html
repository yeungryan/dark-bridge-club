<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DARK · admin</title>
    <style>
      body { margin: 0; padding: 24px 16px; background: #0f2a1e; color: #f3efe4; font: 16px system-ui, sans-serif; }
      main { max-width: 360px; margin: 0 auto; display: grid; gap: 12px; }
      input, select, button { font: inherit; min-height: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid #546; }
      button { background: #e8c25a; border: 0; font-weight: 650; }
      p { margin: 0; color: #b9b4a5; }
      h2 { margin: 12px 0 0; font-size: 1.05rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Player PINs</h1>
      <label>Admin key <input id="key" type="password" autocomplete="off" /></label>
      <label>Player
        <select id="profile">
          <option value="darren">Darren</option>
          <option value="adrian">Adrian</option>
          <option value="ryan">Ryan</option>
          <option value="kim">Kim</option>
        </select>
      </label>
      <h2>Set a PIN</h2>
      <p>Gives the player this PIN and signs them out everywhere, so they sign in with it next time.</p>
      <label>New PIN <input id="pin" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="off" /></label>
      <button id="set">Set PIN</button>
      <h2>Or reset it</h2>
      <p>Clears the player's PIN and signs them out everywhere. Next time they open the link, they choose a new PIN.</p>
      <button id="go">Reset PIN</button>
      <p id="result" role="status"></p>
    </main>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const who = () => $('profile').selectedOptions[0].textContent;
      async function post(path, extra) {
        return fetch(path, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ adminKey: $('key').value, profile: $('profile').value, ...extra }),
        });
      }
      $('set').addEventListener('click', async () => {
        const pin = $('pin').value.trim();
        if (!/^\d{4}$/.test(pin)) return ($('result').textContent = 'Enter a 4-digit PIN.');
        const res = await post('/api/admin/set-pin', { pin });
        $('result').textContent = res.ok ? `Done. ${who()}'s PIN is set.` : res.status === 403 ? 'That admin key is not right.' : 'That did not work. Try again.';
        if (res.ok) $('pin').value = '';
      });
      $('go').addEventListener('click', async () => {
        const res = await post('/api/admin/reset-pin', {});
        $('result').textContent = res.ok ? `Done. ${who()}'s PIN is cleared.` : 'That admin key is not right.';
      });
    </script>
  </body>
</html>
