<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DARK · four-seat test</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
      .bar { padding: 6px 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; height: calc(100% - 40px); }
      iframe { width: 100%; height: 100%; border: 0; background: #000; }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>Four-seat test page (dev only)</strong>
      <span>Opens chosen seats in one window. Example: <code>?k=ROOM_KEY&amp;seats=darren,adrian,kim&amp;pins=1111,2222,4444&amp;bots=1,1,1</code></span>
    </div>
    <div class="grid" id="grid"></div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const k = params.get('k') ?? 'dev';
      const seats = (params.get('seats') ?? 'darren,adrian,ryan,kim').split(',');
      const pins = (params.get('pins') ?? '1111,2222,3333,4444').split(',');
      const bots = (params.get('bots') ?? '1,1,0,1').split(',');
      seats.forEach((as, i) => {
        const frame = document.createElement('iframe');
        frame.title = as;
        frame.src = `/?slot=dev-${as}&k=${encodeURIComponent(k)}&as=${as}&pin=${pins[i]}&bot=${bots[i] ?? 0}`;
        document.getElementById('grid').appendChild(frame);
      });
    </script>
  </body>
</html>
